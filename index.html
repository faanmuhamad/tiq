<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dcecff">
  <title>Selamat Ulang Tahun 💙</title>
  <meta name="description" content="Sebuah kejutan kecil untukmu.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <!-- latar: gelembung & hati melayang -->
  <div class="sky" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <button id="musicBtn" class="music-btn" aria-label="Musik" hidden>
    <span class="note">♪</span>
  </button>
  <audio id="bgm" loop preload="auto"></audio>

  <main>
    <!-- 1. AMPLOP -->
    <section class="scene active" id="s-envelope">
      <p class="eyebrow">untuk <span data-nama></span></p>
      <h1 class="script" id="pembuka"></h1>
      <button class="envelope" id="envelope" aria-label="Buka amplop">
        <span class="env-back"></span>
        <span class="env-letter"><span class="env-letter-line"></span><span class="env-letter-line short"></span></span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="env-seal">♥</span>
      </button>
      <p class="hint pulse">Ketuk amplopnya</p>
    </section>

    <!-- 2. SURAT -->
    <section class="scene" id="s-letter">
      <article class="paper">
        <div id="letterBody"></div>
        <p class="sign">from..,<br><span class="script" data-dari></span></p>
      </article>
      <button class="btn" data-next="s-wish">Lanjut ›</button>
    </section>

    <!-- 3. MAKE A WISH -->
    <section class="scene" id="s-wish">
      <h2 class="script" id="wishJudul"></h2>
      <p class="sub" id="wishPetunjuk"></p>
      <div class="hold-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="54"/>
          <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="54"/>
        </svg>
        <button class="hold-btn" id="holdBtn" aria-label="Tahan untuk make a wish">
          <span class="hold-star">✦</span>
          <span class="hold-label" id="holdLabel">Tahan</span>
        </button>
      </div>
      <p class="wish-done" id="wishDone" hidden></p>
      <button class="btn" data-next="s-cake" id="wishNext" hidden>Sekarang tiup lilinnya ›</button>
    </section>

    <!-- 4. KUE -->
    <section class="scene" id="s-cake">
      <h2 class="script">Tiup lilinnya!</h2>
      <p class="sub" id="cakeHint">Tiup ke arah mikrofon, atau ketuk tiap lilin.</p>
      <div class="cake" id="cake">
        <div class="candles" id="candles"></div>
        <div class="tier tier-top"><span class="drip"></span></div>
        <div class="tier tier-bottom"><span class="drip"></span><span class="sprinkles"></span></div>
        <div class="plate"></div>
      </div>
      <div class="cake-actions">
        <button class="btn ghost" id="micBtn">🎤 Tiup pakai mic</button>
      </div>
      <div class="hbd" id="hbd" hidden>
        <h1 class="script big">Happy Birthday<br><span data-nama></span>!</h1>
        <p class="age" id="ageLine" hidden></p>
        <button class="btn" data-next="s-gallery">Lihat kenangan ›</button>
      </div>
    </section>

    <!-- 5. GALERI -->
    <section class="scene" id="s-gallery">
      <h2 class="script">Kenangan</h2>
      <div class="gallery" id="gallery">
        <div class="track" id="track"></div>
      </div>
      <div class="dots" id="dots"></div>
      <button class="btn" data-next="s-end">Satu lagi ›</button>
    </section>

    <!-- 6. PENUTUP -->
    <section class="scene" id="s-end">
      <div class="big-heart" aria-hidden="true">💙</div>
      <p class="closing" id="penutup"></p>
      <p class="sign"><span class="script" data-dari></span></p>
      <button class="btn ghost" id="replay">↺ Ulangi dari awal</button>
    </section>
  </main>

  <script src="config.js?v=3"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
